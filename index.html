<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{margin:0}</style>
<title>Échiquier V2</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;color-scheme:dark}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;color-scheme:light}}
:root[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;color-scheme:light}
:root[data-theme="dark"]{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{max-width:792px;margin:0 auto;padding-block:32px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.iso-legend>*{min-width:0}

.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

.iso-stage{position:relative;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.iso-stage:focus-visible{outline:2px solid var(--anatomy-blue);outline-offset:6px}
.iso-stage [data-mv]{cursor:grab}
.iso-stage[data-drag],.iso-stage[data-drag] [data-mv]{cursor:grabbing}
.iso-stage [data-mv][data-hot] .iso-edge{stroke:var(--anatomy-blue)}
.iso-stage .iso-halo{pointer-events:none}
.iso-stage [data-info]{cursor:pointer}
.iso-stage [data-mv],.iso-stage [data-mv] [data-info]{cursor:grab}
.iso-stage[data-drag] [data-mv] [data-info]{cursor:grabbing}
.iso-stage [data-info][data-sel] .iso-edge{stroke:var(--anatomy-blue);stroke-width:2}
.iso-info{margin-top:28px;border-top:1px solid var(--anatomy-faint);padding-top:20px;color:var(--anatomy-text)}
.iso-info [hidden]{display:none!important}
.info-hint{margin:0 0 16px;font-size:14px;line-height:1.6;max-width:62ch}
.info-group{margin:0 0 14px}
.info-group h4,.info-sec h4{margin:0 0 8px;font:11px/1.2 var(--anatomy-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--anatomy-muted);font-weight:400}
.info-chips{display:flex;flex-wrap:wrap;gap:8px}
.info-chip{appearance:none;background:transparent;color:var(--anatomy-text);border:1px solid var(--anatomy-faint);border-radius:0;min-height:34px;padding:0 10px;font:13px/1.2 ui-sans-serif,system-ui,sans-serif;cursor:pointer;text-align:left}
.info-chip:hover{border-color:var(--anatomy-hi);color:var(--anatomy-strong)}
.info-chip:focus-visible,.info-back:focus-visible{outline:2px solid var(--anatomy-blue);outline-offset:2px}
.info-card{display:grid;gap:14px;min-width:0}
.info-card>*{min-width:0;margin:0}
.info-back{justify-self:start}
.info-kicker{font:11px/1.2 var(--anatomy-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--anatomy-muted)}
.info-title{font:600 22px/1.25 ui-sans-serif,system-ui,sans-serif;color:var(--anatomy-strong);text-wrap:balance}
.info-title:focus{outline:none}
.info-status{justify-self:start;font:11px/1 var(--anatomy-mono);letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--anatomy-mid);padding:6px 8px;color:var(--anatomy-strong)}
.info-status[data-k="dess"]{border-color:var(--anatomy-blue)}
.info-status[data-k="ach"]{border-color:var(--anatomy-green)}
.info-role{font-size:14px;line-height:1.65;max-width:68ch}
.info-dims{display:grid;grid-template-columns:minmax(120px,max-content) 1fr;gap:6px 18px;font-size:13.5px;line-height:1.5}
.info-dims dt{color:var(--anatomy-muted)}
.info-dims dd{margin:0;color:var(--anatomy-strong);overflow-wrap:anywhere}
.info-tbl{overflow-x:auto}
.info-tbl table{border-collapse:collapse;font-size:12.5px;min-width:260px}
.info-tbl th{font:11px/1.2 var(--anatomy-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--anatomy-muted);font-weight:400;text-align:left;padding:6px 14px 6px 0;border-bottom:1px solid var(--anatomy-faint)}
.info-tbl td{padding:5px 14px 5px 0;border-bottom:1px solid var(--anatomy-faint);color:var(--anatomy-text)}
.info-tbl tr.cur td{color:var(--anatomy-blue);font-weight:600}
.info-plan{display:grid;gap:6px}
.info-plan-t{font:11px/1.2 var(--anatomy-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--anatomy-muted)}
.info-cap{margin:0;font-size:12.5px;line-height:1.5;color:var(--anatomy-muted);max-width:70ch}
.pl-wrap{overflow-x:auto;border:1px solid var(--anatomy-faint);background:var(--anatomy-card);padding:6px}
.pl{display:block;width:100%;height:auto;margin:0 auto}
.pl-wide{min-width:640px}
.pl-t{fill:var(--anatomy-text);font-family:var(--anatomy-mono)}
.pl-muted{fill:var(--anatomy-muted)}
.pl-warn-t{fill:var(--anatomy-red)}
.pl-stiff-t{fill:#e08a1e}
.pl-pocket-t{fill:var(--anatomy-blue)}
.pl-l{stroke:var(--anatomy-muted);stroke-width:1;vector-effect:non-scaling-stroke}
.pl-grid{stroke:var(--anatomy-faint)}
.pl-grid2{stroke:var(--anatomy-mid)}
.pl-d .pl-l{stroke:var(--anatomy-muted)}
.pl-warn .pl-l{stroke:var(--anatomy-red);stroke-width:1.6}
.pl-r{fill:var(--anatomy-face);stroke:var(--anatomy-mid);stroke-width:1;vector-effect:non-scaling-stroke}
.pl-floor{fill:var(--anatomy-card)}
.pl-ledge{fill:var(--anatomy-faint)}
.pl-plate{fill:var(--anatomy-face)}
.pl-dark{fill:var(--anatomy-mid);fill-opacity:.3;stroke:none}
.pl-part{fill:var(--anatomy-faint)}
.pl-part2{fill:var(--anatomy-face)}
.pl-chip{fill:var(--anatomy-lo)}
.pl-pad{fill:var(--anatomy-hi);stroke:none}
.pl-motor{fill:var(--anatomy-lo)}
.pl-pcb{fill:var(--anatomy-face)}
.pl-flex{fill:var(--anatomy-faint);stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke}
.pl-strip{fill:none;stroke:var(--anatomy-mid)}
.pl-strip2{fill:var(--anatomy-faint)}
.pl-ring{fill:none;stroke:var(--anatomy-lo)}
.pl-mag{fill:var(--anatomy-mid)}
.pl-bar{fill:var(--anatomy-mid);stroke:none}
.pl-dashed{fill:none;stroke-dasharray:5 3;stroke:var(--anatomy-mid)}
.pl-pocket{fill:none;stroke:var(--anatomy-blue);stroke-dasharray:3 2}
.pl-hatchbox{fill:var(--anatomy-faint);fill-opacity:.8;stroke:var(--anatomy-mid);stroke-dasharray:4 3}
.pl-stiff{fill:none;stroke:#e08a1e;stroke-width:1.2;stroke-dasharray:5 3;vector-effect:non-scaling-stroke}
.pl-rod{stroke:var(--anatomy-mid);stroke-width:3}
.pl-wire{fill:none;stroke:var(--anatomy-lo);stroke-width:1.5;vector-effect:non-scaling-stroke}
.pl [data-plan].on{fill:var(--anatomy-blue);fill-opacity:.55;stroke:var(--anatomy-blue)}
.pl-t.on{fill:var(--anatomy-blue);fill-opacity:1;font-weight:700;stroke:none}
.pl-rod.on,.pl-wire.on{stroke:var(--anatomy-blue);fill:none}
.pl-strip.on{fill:none;stroke:var(--anatomy-blue);stroke-width:2}
.info-sec ul{margin:0;padding-left:18px;display:grid;gap:6px;font-size:13.5px;line-height:1.55;max-width:70ch}
.info-sec.todo li::marker{color:var(--anatomy-blue)}
.info-foot{font-size:12px;line-height:1.5;color:var(--anatomy-muted);max-width:70ch}
@media (max-width:520px){.info-dims{grid-template-columns:1fr;gap:2px}.info-dims dd{margin-bottom:8px}.info-title{font-size:19px}}
.iso-controls{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;margin-top:16px}
.iso-btns{display:flex;flex-wrap:wrap;gap:8px}
.iso-btn{appearance:none;background:transparent;color:var(--anatomy-text);border:1px solid var(--anatomy-mid);border-radius:0;min-height:34px;padding:0 12px;font:11px/1 var(--anatomy-mono);letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.iso-btn:hover{border-color:var(--anatomy-hi);color:var(--anatomy-strong)}
.iso-btn[aria-pressed="true"]{border-color:var(--anatomy-hi);color:var(--anatomy-strong);background:var(--anatomy-face)}
.iso-btn:focus-visible,.iso-field input:focus-visible{outline:2px solid var(--anatomy-blue);outline-offset:2px}
.iso-field{display:flex;align-items:center;gap:8px;color:var(--anatomy-muted);font:11px/1 var(--anatomy-mono);letter-spacing:.08em;text-transform:uppercase}
.iso-field input{width:54px;min-height:34px;border:1px solid var(--anatomy-mid);border-radius:0;background:var(--anatomy-page);color:var(--anatomy-strong);padding:0 8px;font:13px/1 var(--anatomy-mono);text-transform:lowercase;text-align:center}
.iso-field input[aria-invalid="true"]{border-color:var(--anatomy-red)}
.iso-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

<script type="module">const AZIMUTH = 45;

function pathOf(points, closed = false) {

        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],

    for (const [cx, cy, start] of corners) {

  if (d && Math.hypot(e.clientX - d.x, e.clientY - d.y) < 6 && e.button === 0) { takeOver(); select(d.id, d.inst); }
});
stage.addEventListener("pointerup", release);
stage.addEventListener("pointercancel", release);
stage.addEventListener("lostpointercapture", release);

// ---- controls
buttons.forEach((b) => b.addEventListener("click", () => { takeOver(); flash = ""; setView(+b.dataset.view); }));
document.querySelector("[data-reset]").addEventListener("click", () => {
  takeOver(); flash = ""; tgt.x = GX0; tgt.y = GY0; tau.car = 0.45; setView(0);
});
const form = document.querySelector("[data-goto]"), input = form.querySelector("input");
form.addEventListener("submit", (e) => {
  e.preventDefault(); takeOver();
  const m = /^([a-h])([1-8])$/i.exec(input.value.trim());
  if (!m) { input.setAttribute("aria-invalid", "true"); flash = "case inconnue · de a1 à h8"; draw(); return; }
  input.removeAttribute("aria-invalid"); flash = "";
  tgt.x = ("abcdefgh".indexOf(m[1].toLowerCase()) + 0.5) * CASE;
  tgt.y = (8 - +m[2] + 0.5) * CASE;
  tau.car = 0.5; setView(view === 2 || view === 3 ? view : 3);
  flash = "aimant envoyé sous " + m[1].toLowerCase() + m[2]; run();
});
input.addEventListener("input", () => { input.removeAttribute("aria-invalid"); if (flash) { flash = ""; draw(); } });
stage.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { select(null); return; }
  const next = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[e.key];
  if (!next) return;
  e.preventDefault(); takeOver(); flash = "";
  setView(clamp((view < 0 ? 1 : view) + next, 0, VIEWS.length - 1));
});

const panel = document.querySelector("[data-info-panel]"), card = panel.querySelector("[data-card]"), empty = panel.querySelector("[data-empty]");
let sel = null;
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
function listOf(title, items, cls) {
  if (!items || !items.length) return null;
  const w = el("section", "info-sec " + (cls || "")); w.appendChild(el("h4", null, title));
  const ul = el("ul"); for (const t of items) ul.appendChild(el("li", null, t)); w.appendChild(ul); return w;
}
function planBlock(key) {
  const p = PLANS[key], fig = el("figure", "info-plan");
  fig.appendChild(el("figcaption", "info-plan-t", p.title));
  const wrap = el("div", "pl-wrap"); wrap.innerHTML = p.svg; fig.appendChild(wrap);
  if (p.cap) fig.appendChild(el("p", "info-cap", p.cap));
  return fig;
}
function render(id, inst) {
  const e = INFO[id], strip = inst != null && ["nappe", "capteur", "mux", "languette"].indexOf(id) >= 0;
  card.textContent = "";
  const back = el("button", "iso-btn info-back", "← Toutes les pièces"); back.type = "button"; back.setAttribute("data-back", ""); card.appendChild(back);
  card.appendChild(el("p", "info-kicker", e.g));
  const title = strip ? e.t.replace(" (×4)", "") + " · nappe " + (inst + 1) + " (rangs " + STRIPR[inst][0] + "-" + STRIPR[inst][1] + ")" : e.t;
  const h = el("h3", "info-title", title); h.id = "info-title"; h.tabIndex = -1; card.appendChild(h);
  card.appendChild(el("p", "info-status", e.st.t)).setAttribute("data-k", e.st.k);
  card.appendChild(el("p", "info-role", e.role));
  const dl = el("dl", "info-dims");
  for (const [k, v] of e.dims) { dl.appendChild(el("dt", null, k)); dl.appendChild(el("dd", null, v)); }
  card.appendChild(dl);
  if (e.table) {
    const wrap = el("div", "info-tbl"), t = el("table"), thead = el("thead"), hr = el("tr");
    for (const c of e.table.head) hr.appendChild(el("th", null, c));
    thead.appendChild(hr); t.appendChild(thead);
    const tb = el("tbody");
    e.table.rows.forEach((r, i) => { const tr = el("tr", id === "nappe" && inst === i ? "cur" : ""); for (const c of r) tr.appendChild(el("td", null, c)); tb.appendChild(tr); });
    t.appendChild(tb); wrap.appendChild(t); card.appendChild(wrap);
  }
  for (const key of ["ov"].concat(e.plans)) card.appendChild(planBlock(key));
  for (const x of [listOf("À savoir", e.notes), listOf("À vérifier, à faire", e.todo, "todo"), listOf("Historique des décisions", e.hist)]) if (x) card.appendChild(x);
  card.appendChild(el("p", "info-foot", "Cotes et plans générés depuis le modèle (model.mjs) le " + BUILT + ". Les textes sont tenus à la main. Tout est estimé tant que rien n'est mesuré."));
  card.querySelectorAll("[data-plan]").forEach((n) => {
    const ids = n.getAttribute("data-plan").split(" ");
    n.classList.toggle("on", ids.indexOf(id) >= 0 && (inst == null || n.dataset.inst == null || n.dataset.inst === String(inst)));
  });
}
function select(id, inst) {
  svg.querySelectorAll("[data-sel]").forEach((n) => n.removeAttribute("data-sel"));
  if (!id || !INFO[id]) { sel = null; card.hidden = true; empty.hidden = false; return; }
  const k = inst == null ? null : +inst;
  sel = { id, inst: k };
  svg.querySelectorAll('[data-info="' + id + '"]').forEach((n) => { if (k == null || n.dataset.inst == null || n.dataset.inst === String(k)) n.setAttribute("data-sel", ""); });
  render(id, k); empty.hidden = true; card.hidden = false; flash = ""; draw();
  const r = card.getBoundingClientRect();
  if (r.top > innerHeight * 0.7) card.scrollIntoView({ block: "start", behavior: still.matches ? "auto" : "smooth" });
}
panel.addEventListener("click", (e) => {
  const b = e.target.closest ? e.target.closest("[data-pick],[data-back]") : null;
  if (!b) return;
  takeOver();
  if (b.hasAttribute("data-back")) { select(null); return; }
  select(b.dataset.pick, null);
});

new IntersectionObserver((e) => { visible = e[e.length - 1].isIntersecting; if (visible) run(); }, { rootMargin: "120px 0px" }).observe(stage);
syncButtons();
draw();
})();
