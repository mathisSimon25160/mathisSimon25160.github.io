*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(760px,100% - 32px);margin:64px auto 96px}

.iso-stage{position:relative;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}

</section></div><figcaption class="iso-legend"><span class="iso-keys"><span class="iso-key"><svg class="iso-swatch" data-mark="lit" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Électroaimant 12 V, 10 × 10 mm</span><span class="iso-key"><svg class="iso-swatch" data-mark="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Bois, rails Ø6 et roulements LM6UU</span><span class="iso-key"><svg class="iso-swatch" data-mark="flat" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 6.5 8 3.5 14 6.5 8 9.5Z"/></svg>4 nappes souples : 16 capteurs et 1 mux chacune</span></span><span class="iso-caption">Glisse le plateau pour le retirer. Tire une nappe vers le haut pour la débrancher. Une fois le plateau enlevé, le chariot se déplace dans le plan, le portique suit sur les tiges latérales et le fil de l'électroaimant garde sa boucle. Plateau de jeu 32 × 32 cm (cases de 40 mm) avec 5 cm de cimetière de chaque côté, deux NEMA17 pancake montés tête en bas à droite. Hauteurs estimées, rien n'est encore mesuré. Moteurs, carte mère et fil de pêche restent fixes : le tracé du fil de pêche est à valider sur maquette.</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {
    if (!points.length)
        return "";
    return points.map(([x, y], at) => `${at ? "L" : "M"}${tenth(x)} ${tenth(y)}`).join("") + (closed ? "Z" : "");
}
const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));
    const corners = [
        [x + w - radius, y + radius, -90],
        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],
    ];
    const out = [];
    for (const [cx, cy, start] of corners) {
        const count = radius > 0 ? steps : 0;
        for (let step = 0; step <= count; step++) {
            const angle = (start + (count ? (90 * step) / count : 45)) * RADIANS;
            out.push([cx + radius * Math.cos(angle), cy + radius * Math.sin(angle)]);
        }
    }
    return out;
}
function signedArea(points) {
    let area = 0;
    for (let index = 0; index < points.length; index++) {
        const [ax, ay] = points[index];
        const [bx, by] = points[(index + 1) % points.length];
        area += ax * by - bx * ay;
    }
    return area / 2;
}
const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);
function convexHull(points) {
    const sorted = [...points].sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    if (sorted.length < 3)
        return sorted;
    const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const lower = [];
    for (const point of sorted) {
        while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], point) <= 0)
            lower.pop();
        lower.push(point);
    }
    const upper = [];
    for (let index = sorted.length - 1; index >= 0; index--) {
        const point = sorted[index];
        while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], point) <= 0)
            upper.pop();
        upper.push(point);
    }
    return [...lower.slice(0, -1), ...upper.slice(0, -1)];
}
function runsOf(flags, want) {

    const runs = [];
    const start = flags.findIndex((flag, index) => flag !== flags[(index + count - 1) % count]);
    if (start < 0)

    let run = null;
    for (let step = 0; step < count; step++) {
        const index = (start + step) % count;
        if (flags[index] === want) {
            if (!run)
                run = [index];
            run.push((index + 1) % count);
        }
        else if (run) {
            runs.push(run);
            run = null;

}
function extrude(ring, z, height, projection, options = {}) {

    }

  const m = /^([a-h])([1-8])$/i.exec(input.value.trim());
  if (!m) { input.setAttribute("aria-invalid", "true"); flash = "case inconnue · de a1 à h8"; draw(); return; }
  input.removeAttribute("aria-invalid"); flash = "";
  tgt.x = ("abcdefgh".indexOf(m[1].toLowerCase()) + 0.5) * CASE;
  tgt.y = (8 - +m[2] + 0.5) * CASE;
  tau.car = 0.5; setView(view === 2 || view === 3 ? view : 3);
  flash = "aimant envoyé sous " + m[1].toLowerCase() + m[2]; run();
});
input.addEventListener("input", () => { input.removeAttribute("aria-invalid"); if (flash) { flash = ""; draw(); } });
stage.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { select(null); return; }
  const next = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[e.key];
  if (!next) return;
  e.preventDefault(); takeOver(); flash = "";
  setView(clamp((view < 0 ? 1 : view) + next, 0, VIEWS.length - 1));
});

      const li = el("li");
      if (b.url) { const a = el("a", null, b.name + " · " + b.ref); a.href = b.url; a.target = "_blank"; a.rel = "noopener noreferrer"; li.appendChild(a); } else li.appendChild(document.createTextNode(b.name));
      if (b.cart) li.appendChild(el("span", "info-buy-n", " — " + b.cart));
      ul.appendChild(li);
    }
    w.appendChild(ul); w.appendChild(el("p", "info-buy-w", "Liens construits à partir du numéro LCSC : je n'ai pas pu les ouvrir d'ici. Si une page ne s'ouvre pas, cherche le numéro « C… » sur lcsc.com.")); card.appendChild(w);
  }
  for (const key of ["ov"].concat(e.plans)) card.appendChild(planBlock(key));
  for (const x of [listOf("À savoir", e.notes), listOf("À vérifier, à faire", e.todo, "todo"), listOf("Historique des décisions", e.hist)]) if (x) card.appendChild(x);
  card.appendChild(el("p", "info-foot", "Cotes et plans générés depuis le modèle (model.mjs) le " + BUILT + ". Les textes sont tenus à la main. Tout est estimé tant que rien n'est mesuré."));
  card.querySelectorAll("[data-plan]").forEach((n) => {
    const ids = n.getAttribute("data-plan").split(" ");
    n.classList.toggle("on", ids.indexOf(id) >= 0 && (inst == null || n.dataset.inst == null || n.dataset.inst === String(inst)));
  });
}
function select(id, inst) {
  svg.querySelectorAll("[data-sel]").forEach((n) => n.removeAttribute("data-sel"));
  if (!id || !INFO[id]) { sel = null; card.hidden = true; empty.hidden = false; return; }
  const k = inst == null ? null : +inst;
  sel = { id, inst: k };
  svg.querySelectorAll('[data-info="' + id + '"]').forEach((n) => { if (k == null || n.dataset.inst == null || n.dataset.inst === String(k)) n.setAttribute("data-sel", ""); });
  render(id, k); empty.hidden = true; card.hidden = false; flash = ""; draw();
  const r = card.getBoundingClientRect();
  if (r.top > innerHeight * 0.7) card.scrollIntoView({ block: "start", behavior: still.matches ? "auto" : "smooth" });
}
panel.addEventListener("click", (e) => {
  const b = e.target.closest ? e.target.closest("[data-pick],[data-back]") : null;
  if (!b) return;
  takeOver();
  if (b.hasAttribute("data-back")) { select(null); return; }
  select(b.dataset.pick, null);
});

new IntersectionObserver((e) => { visible = e[e.length - 1].isIntersecting; if (visible) run(); }, { rootMargin: "120px 0px" }).observe(stage);
syncButtons();
draw();
})();
</script></body></html>
